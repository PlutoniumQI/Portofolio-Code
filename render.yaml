# Render Blueprint for the Laravel + Filament backend.
# Docs: https://render.com/docs/blueprint-spec
#
# The Next.js frontend is deployed separately on Vercel. Secrets marked
# `sync: false` are prompted for when the Blueprint is created and are never
# committed to git.
services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /up
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: APP_NAME
        value: "re:SKY API"
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false

      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_FAKER_LOCALE
        value: en_US

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public

      - key: RUN_MIGRATIONS
        value: "true"
      # Set to true for one restart to create the admin user and placeholder
      # content, then set back to false. Managed in the Render dashboard.
      - key: SEED_DATABASE
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Uploads are committed to a public GitHub repository so they survive
      # Render restarts. The token needs Contents: Read and write on that repo.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_ASSETS_OWNER
        sync: false
      - key: GITHUB_ASSETS_REPO
        sync: false
      - key: GITHUB_ASSETS_BRANCH
        value: main
      - key: GITHUB_ASSETS_PATH
        value: portfolio

      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_ALLOW_VERCEL_PREVIEWS
        value: "false"
      - key: FRONTEND_REVALIDATE_URL
        sync: false
      - key: FRONTEND_REVALIDATE_SECRET
        sync: false

      # Keep the Laravel upload cap below PHP's limits.
      - key: PORTFOLIO_MAX_UPLOAD_KB
        value: "10240"
      - key: PHP_UPLOAD_MAX_FILE_SIZE
        value: 10M
      - key: PHP_POST_MAX_SIZE
        value: 12M
      - key: PHP_OPCACHE_ENABLE
        value: "1"

      # serversideup/php listens on 8080 by default; Render routes to 10000.
      - key: NGINX_HTTP_PORT
        value: "10000"
      - key: SSL_MODE
        value: "off"
      # Use Laravel's /up route for the image's own Docker health check too.
      - key: HEALTHCHECK_PATH
        value: /up
